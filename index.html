
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Button Sandbox</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0b0e;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 25px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 21px;
    font-weight: 800;
}

.logo span {
    color: #ff7a24;
}

.tag {
    color: #888;
    font-size: 12px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.preview {
    height: 340px;
    background: #111115;
    border: 1px solid #26262d;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 20px;
}

.preview-label {
    color: #777;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#demoButton {
    cursor: pointer;
    border: none;
    background: #25252b;
    color: white;
    padding: 13px 27px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
}

.editor {
    background: #111115;
    border: 1px solid #26262d;
    border-radius: 15px;
    overflow: hidden;
}

.editor-header {
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #26262d;
}

.editor-header span {
    font-size: 13px;
    font-weight: bold;
}

.editor-header small {
    color: #777;
    font-size: 11px;
}

textarea {
    width: 100%;
    height: 260px;
    resize: vertical;
    background: #0d0d11;
    color: #a9e6bb;
    border: none;
    outline: none;
    padding: 20px;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    tab-size: 4;
}

textarea::placeholder {
    color: #555;
}

.actions {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #26262d;
}

.action-btn {
    padding: 11px 17px;
    border-radius: 7px;
    border: 1px solid #33333b;
    background: #202027;
    color: white;
    cursor: pointer;
    font-size: 12px;
}

.action-btn.primary {
    background: #ff7a24;
    border-color: #ff7a24;
    color: black;
    font-weight: bold;
}

.action-btn:hover {
    filter: brightness(1.2);
}

footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 25px;
}

@media(max-width: 600px) {
    body {
        padding: 12px;
    }

    .preview {
        height: 280px;
    }

    textarea {
        height: 220px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">CSS<span>LAB</span></div>
    <div class="tag">BUTTON SANDBOX v1.0</div>
</header>

<div class="preview">

    <div class="preview-label">Live Preview</div>

    <button id="demoButton">
        Click Me
    </button>

</div>

<div class="editor">

    <div class="editor-header">
        <span>CSS Editor</span>
        <small>AUTO PREVIEW ENABLED</small>
    </div>

    <textarea
        id="cssEditor"
        spellcheck="false"
        placeholder="/* Add your button CSS here */

#demoButton {
    
}"></textarea>

    <div class="actions">

        <button class="action-btn primary"
            onclick="copyCSS()">
            Copy CSS
        </button>

        <button class="action-btn"
            onclick="resetCSS()">
            Reset
        </button>

    </div>

</div>

<footer>
    CSSLAB · CREATE SOMETHING COOL
</footer>

</div>

<style id="customCSS"></style>

<script>

const editor = document.getElementById("cssEditor");
const customCSS = document.getElementById("customCSS");

function updatePreview() {
    customCSS.textContent = editor.value;
}

editor.addEventListener("input", updatePreview);

async function copyCSS() {
    try {
        await navigator.clipboard.writeText(editor.value);
        alert("CSS copied!");
    } catch {
        editor.select();
        document.execCommand("copy");
        alert("CSS copied!");
    }
}

function resetCSS() {
    editor.value = "";
    updatePreview();
}

</script>

</body>
</html>
