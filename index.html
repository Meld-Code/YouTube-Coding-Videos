
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Button Studio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111113;
    color: #e5e5e5;
    font-family: Inter, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

header {
    height: 55px;
    border-bottom: 1px solid #29292d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #171719;
}

.logo {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .5px;
}

.logo span {
    color: #ff8a3d;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #85858d;
    font-size: 11px;
}

.status {
    width: 7px;
    height: 7px;
    background: #48cf86;
    border-radius: 50%;
    display: inline-block;
}

main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100vh - 55px);
}

.workspace {
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #29292d;
}

.section-head {
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #19191c;
    border-bottom: 1px solid #29292d;
    font-size: 11px;
    color: #9999a1;
    flex-shrink: 0;
}

.tabs {
    display: flex;
    height: 43px;
    background: #151517;
    border-bottom: 1px solid #29292d;
    flex-shrink: 0;
}

.tab {
    padding: 0 20px;
    border: none;
    border-right: 1px solid #29292d;
    background: transparent;
    color: #777780;
    cursor: pointer;
    font-size: 12px;
    position: relative;
}

.tab.active {
    color: white;
    background: #202024;
}

.tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: #ff8a3d;
}

.editor-area {
    flex: 1;
    min-height: 0;
    background: #212121;
    position: relative;
}

.editor-pane {
    height: 100%;
    display: none;
}

.editor-pane.active {
    display: block;
}

.CodeMirror {
    height: 100%;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.7;
    background: #212121;
}

.CodeMirror-gutters {
    background: #1b1b1d;
    border-right: 1px solid #303034;
}

.CodeMirror-linenumber {
    color: #626269;
    padding: 0 12px 0 5px;
}

.CodeMirror-cursor {
    border-left: 2px solid #ff9c5b;
}

.CodeMirror-selected {
    background: #42424d !important;
}

.CodeMirror-focused .CodeMirror-selected {
    background: #373b4a !important;
}

.CodeMirror-matchingbracket {
    color: #fff !important;
    border-bottom: 1px solid #ff9b57;
}

.editor-footer {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 13px;
    border-top: 1px solid #29292d;
    background: #19191c;
    flex-shrink: 0;
}

.footer-info {
    color: #777780;
    font-size: 10px;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    font-family: inherit;
}

.small-btn {
    border: 1px solid #39393e;
    background: #252529;
    color: #d0d0d5;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 10px;
    cursor: pointer;
}

.small-btn:hover {
    background: #34343a;
}

.preview-workspace {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #111113;
}

.preview-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    padding: 20px;
    background-color: #111113;
    background-image: radial-gradient(#29292e 1px, transparent 1px);
    background-size: 20px 20px;
}

iframe {
    border: none;
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 5px;
}

.preview-footer {
    height: 40px;
    border-top: 1px solid #29292d;
    background: #19191c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 13px;
    color: #888890;
    font-size: 10px;
}

.run-dot {
    color: #48cf86;
}

@media(max-width: 700px) {
    body {
        overflow: auto;
        height: auto;
    }

    main {
        display: flex;
        flex-direction: column;
        height: auto;
    }

    .workspace {
        height: 550px;
        border-right: none;
    }

    .preview-workspace {
        height: 400px;
    }

    header {
        padding: 0 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">BUTTON<span>STUDIO</span></div>

    <div class="header-right">
        <span class="status"></span>
        LIVE PREVIEW
    </div>
</header>

<main>

    <section class="workspace">

        <div class="section-head">
            <span>EDITOR</span>
            <span>Auto-save · Auto-preview</span>
        </div>

        <div class="tabs">
            <button class="tab" data-tab="html">HTML</button>
            <button class="tab active" data-tab="css">CSS</button>
            <button class="tab" data-tab="js">JS</button>
        </div>

        <div class="editor-area">

            <div class="editor-pane" id="pane-html">
                <textarea id="htmlEditor"><button id="demoButton">Click Me</button></textarea>
            </div>

            <div class="editor-pane active" id="pane-css">
                <textarea id="cssEditor">#demoButton {
    padding: 16px 35px;
    background: #ff8a3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

#demoButton:hover {
    transform: translateY(-4px);
}</textarea>
            </div>

            <div class="editor-pane" id="pane-js">
                <textarea id="jsEditor">// Add your JavaScript here

const button = document.getElementById("demoButton");

button.addEventListener("click", () => {
    console.log("Button clicked!");
});</textarea>
            </div>

        </div>

        <div class="editor-footer">
            <span class="footer-info" id="languageLabel">CSS · Auto-complete enabled</span>

            <div class="actions">
                <button class="small-btn" id="copyBtn">Copy code</button>
                <button class="small-btn" id="resetBtn">Reset</button>
            </div>
        </div>

    </section>

    <section class="preview-workspace">

        <div class="section-head">
            <span>PREVIEW</span>
            <span>index.html</span>
        </div>

        <div class="preview-area">
            <iframe id="preview" sandbox="allow-scripts"></iframe>
        </div>

        <div class="preview-footer">
            <span><span class="run-dot">●</span> Live output</span>
            <span>HTML + CSS + JS</span>
        </div>

    </section>

</main>

<script>
const defaults = {
    html: '<button id="demoButton">Click Me</button>',
    css: `#demoButton {
    padding: 16px 35px;
    background: #ff8a3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

#demoButton:hover {
    transform: translateY(-4px);
}`,
    js: `// Add your JavaScript here

const button = document.getElementById("demoButton");

button.addEventListener("click", () => {
    console.log("Button clicked!");
});`
};

const modes = {
    html: "htmlmixed",
    css: "css",
    js: "javascript"
};

const editors = {};

function makeEditor(id, mode) {
    const editor = CodeMirror.fromTextArea(
        document.getElementById(id),
        {
            mode: mode,
            theme: "material-darker",
            lineNumbers: true,
            lineWrapping: false,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            autoCloseBrackets: true,
            matchBrackets: true,
            autoCloseTags: mode === "htmlmixed",
            extraKeys: {
                "Tab": function(cm) {
                    if (cm.somethingSelected()) {
                        cm.indentSelection("add");
                    } else {
                        cm.replaceSelection("    ", "end");
                    }
                },
                "Shift-Tab": function(cm) {
                    cm.indentSelection("subtract");
                }
            }
        }
    );

    return editor;
}

editors.html = makeEditor("htmlEditor", modes.html);
editors.css = makeEditor("cssEditor", modes.css);
editors.js = makeEditor("jsEditor", modes.js);

let activeTab = "css";
let updateTimer;

const preview = document.getElementById("preview");

function updatePreview() {
    clearTimeout(updateTimer);

    updateTimer = setTimeout(() => {
        const html = editors.html.getValue();
        const css = editors.css.getValue();
        const js = editors.js.getValue();

        const documentContent = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111113;
    font-family: Arial, sans-serif;
}

${css}
</style>
</head>
<body>
${html}
<script>
try {
${js}
} catch(error) {
    console.error(error);
}
<\/script>
</body>
</html>`;

        preview.srcdoc = documentContent;
    }, 120);
}

Object.values(editors).forEach(editor => {
    editor.on("change", updatePreview);
});

function switchTab(tab) {
    activeTab = tab;

    document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.tab === tab
        );
    });

    document.querySelectorAll(".editor-pane").forEach(pane => {
        pane.classList.toggle(
            "active",
            pane.id === "pane-" + tab
        );
    });

    document.getElementById("languageLabel").textContent =
        tab.toUpperCase() + " · Auto-complete enabled";

    editors[tab].refresh();
}

document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
        switchTab(button.dataset.tab);
    });
});

document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(
            editors[activeTab].getValue()
        );

        document.getElementById("copyBtn").textContent = "Copied!";

        setTimeout(() => {
            document.getElementById("copyBtn").textContent = "Copy code";
        }, 1200);
    } catch {
        const temp = document.createElement("textarea");
        temp.value = editors[activeTab].getValue();
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
    }
});

document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset all three editors?")) return;

    Object.keys(editors).forEach(key => {
        editors[key].setValue(defaults[key]);
    });

    updatePreview();
});

updatePreview();
</script>

</body>
</html>
